<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->

	<title>Booking Cancelation Prediction</title>

	<!-- Google font -->
	<link href="https://fonts.googleapis.com/css?family=Lato:400,400i,700" rel="stylesheet">

	<!-- Bootstrap -->
	<link type="text/css" rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}" />

	<!-- Custom stlylesheet -->
	<link type="text/css" rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />

	<!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
	<!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
	<!--[if lt IE 9]>
		  <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
		  <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
		<![endif]-->

</head>

<body>
    <div id="booking" class="section">
      <div class="section-center">
        <h1 class="booking-title">Booking Cancelation Prediction</h1>
          <div class="container">
            <div class="row">
              <div class="booking-form">
                <form id="prediction-form">
                  <div class="form-group">
                    <label for="booking_id" class="form-label">Booking ID</label>
                    <input class="form-control" id="booking_id" type="text" placeholder="Enter the Booking ID" name="booking_id">
                  </div>
                  <div class="row no-margin">
                    <div class="col-sm-6">
                        <div class="form-group">
                            <label for="adults" class="form-label">Adults (18+)</label>
                            <input id="adults" class="form-control" type="number" name="adults" min="0" placeholder="Enter number of adults">
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="form-group">
                            <label for="children" class="form-label">Children (0-17)</label>
                            <input id="children" class="form-control" type="number" name="children" min="0" placeholder="Enter number of children">
                        </div>
                    </div>
                  </div>
                  <div class="row no-margin">
                    <div class="col-sm-6">
                        <div class="form-group">
                            <label for="weekend" class="form-label">Number of Weekend (Fri/Sat) Nights</label>
                            <input id="weekend" class="form-control" type="number" name="weekend" min="0" placeholder="Enter number of Nights">
                        </div>
                    </div>
                    <div class="col-sm-6">
                      <div class="form-group">
                          <label for="week" class="form-label">Number of Weekend Nights</label>
                          <input id="week" class="form-control" type="number" name="week" min="0" placeholder="Enter number of Nights">
                      </div>
                    </div>
                  </div>
                  <div class="form-group">
                    <label for="meal" class="form-label">Select Meal Type</label>
                    <select id="meal" class="form-control" name="meal">
                        <option value="Not Selected" selected>Not Selected</option>
                        <option value="Meal Plan 1">Meal  Plan 1</option>
                        <option value="Meal Plan 2">Meal  Plan 2</option>
                        <option value="Meal Plan 3">Meal  Plan 3</option>
                    </select>
                    <span class="select-arrow"></span>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Car Parking Space</label>
                    <div class="form-control binary-options">
                        <input type="radio" id="car_parking_yes" name="car_parking" value="1">
                        <label for="car_parking_yes" class="binary-label">Yes</label>
                        
                        <input type="radio" id="car_parking_no" name="car_parking" value="0">
                        <label for="car_parking_no" class="binary-label">No</label>
                    </div>
                  </div>
                  <div class="form-group">
                    <label for="room" class="form-label">Select Room Type</label>
                    <select id="room" class="form-control" name="room">
                        <option value="Room_Type_1">Room Type 1</option>
                        <option value="Room_Type_2">Room Type 2</option>
                        <option value="Room_Type_3">Room Type 3</option>
                        <option value="Room_Type_4">Room Type 4</option>
                        <option value="Room_Type_5">Room Type 5</option>
                        <option value="Room_Type_6">Room Type 6</option>
                        <option value="Room_Type_7">Room Type 7</option>
                    </select>
                    <span class="select-arrow"></span>
                  </div>
                  <div class="form-group">
                    <label for="lead" class="form-label">Lead Time</label>
                    <input id="lead" class="form-control" type="number" placeholder="Enter Lead Time" min="0" name="lead">
                  </div>

                  <div class="form-group">
                    <label for="market" class="form-label">Select Market Segment Type</label>
                    <select id="market" class="form-control" name="market">
                        <option value="Online">Online</option>
                        <option value="Offline">Offline</option>
                        <option value="Cooperate">Cooperate</option>
                        <option value="Complementary">Complementary</option>
                        <option value="Aviation">Aviation</option>
                    </select>
                    <span class="select-arrow"></span>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Repeated</label>
                    <div class="form-control binary-options">
                        <input type="radio" id="repeated_yes" name="repeated" value="1">
                        <label for="repeated_yes" class="binary-label">Yes</label>
                        
                        <input type="radio" id="repeated_no" name="repeated" value="0">
                        <label for="repeated_no" class="binary-label">No</label>
                    </div>
                  </div>
                  <div class="form-group">
                    <label for="P-C" class="form-label">P-C</label>
                    <input id="P-C" class="form-control" type="number" placeholder="Enter P-C" min="0" name="P-C">
                  </div>
                  <div class="form-group">
                    <label for="P-not-C" class="form-label">P-not-C</label>
                    <input id="P-not-C" class="form-control" type="number" placeholder="Enter P-not-C" min="0" name="P-not-C">
                  </div>
                  <div class="form-group">
                    <label for="average price" class="form-label">Average Price</label>
                    <input id="average price" class="form-control" type="number" step="0.01" placeholder="Enter Average Price" min="0" name="average price">
                  </div>
                  <div class="form-group">
                    <label for="request" class="form-label">Select Number of Special Requests</label>
                    <select id="request" class="form-control" name="request">
                        <option value="0" selected>0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                    <span class="select-arrow"></span>
                  </div>
                  <div class="form-group">
                    <label for="date" class="form-label">Date of Reservation</label>
                    <input id="date" class="form-control" type="date" required name="date">
                  </div>
                  <div class="form-btn">
                    <button class="submit-btn" type="submit">Predict Now</button>
                  </div>
                </form>
                <div id="prediction-result" class="prediction-result">
                  <button class="close-btn" onclick="closePrediction()">X</button>
                  <span id="prediction-text"></span>
                </div>
              </div>
            </div>
          </div>
      </div>
    </div>
    <script>
      document.getElementById('prediction-form').addEventListener('submit', function(event) {
          event.preventDefault();
          const formData = new FormData(this);
          console.log('Form data:', formData);
          fetch('/predict', {
              method: 'POST',
              body: formData
          })
          .then(response => response.json())
          .then(data => {
            if (!data.prediction) {
                console.error('Prediction field is missing in response');
                return;
            }

              const resultDiv = document.getElementById('prediction-result');
              resultDiv.className = 'prediction-result ' + data.prediction;
              resultDiv.textContent = data.prediction === 'canceled' ? 'Probably Canceled' : 'Probably Not Canceled';
              resultDiv.style.display = 'flex';
          })
          .catch(error => {
              console.error('Error:', error);
          });
      });
      function closePrediction() {
            const resultDiv = document.getElementById('prediction-result');
            resultDiv.style.display = 'none';
        }
  </script>
</body>

</html>
